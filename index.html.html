<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>לומדים עם חוכמה 🦉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#1b1740; --sky2:#0f3a4a;
    --gold:#ffd36e; --mint:#7be0b5; --plum:#7a4bd6;
    --ink:#fff8e7; --dim:#c9c2e8;
    --glass:rgba(255,248,231,.10); --glass-brd:rgba(255,248,231,.22);
    --coral:#ff8fab;
    --cream:#fff8e7;
    --blue:var(--mint); --blue-dark:#4fb6a0;
    --purple:var(--plum); --purple-dark:#5e35a8;
    --orange:var(--gold); --orange-dark:#e0a93f;
    --green:var(--mint); --amber:var(--gold); --red:var(--coral);
    --card:var(--glass);
    --shadow: 0 6px 18px rgba(0,0,0,.28);
    color-scheme:dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Rubik', sans-serif;
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 75%);
    min-height:100vh;
    color:var(--ink);
    overflow-x:hidden;
    position:relative;
  }
  h1,h2,h3{font-family:'Secular One','Rubik',sans-serif; font-weight:400; margin:0;}

  /* ---- background scene (persists across screens) ---- */
  .moon{position:fixed; top:5%; left:9%; width:76px; height:76px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fffbe8,#ffe9a8 60%,#f3c76a);
    box-shadow:0 0 50px 18px rgba(255,211,110,.3); z-index:0; animation:glow 6s ease-in-out infinite;}
  @keyframes glow{50%{box-shadow:0 0 70px 26px rgba(255,211,110,.45);}}
  .hill{position:fixed; bottom:-10%; width:130%; height:24%; border-radius:50%; z-index:0;}
  .hill.h1{right:-40%; background:#0b2a38;}
  .hill.h2{left:-45%; bottom:-14%; background:#071d28;}
  #fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:1;}
  #confettiFx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:60;}

  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    padding:calc(70px + env(safe-area-inset-top,0px)) 16px 40px;
    position:relative;
    z-index:2;
    transition:padding-bottom .2s;
  }
  #app.has-hint{ padding-bottom:110px; }

  /* ---- shared surfaces ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .icon-btn{
    background:var(--glass); border:1px solid var(--glass-brd); border-radius:16px;
    width:52px; height:52px; font-size:22px; cursor:pointer; color:var(--ink);
    box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .icon-btn:active{transform:translateY(3px);}
  .mute-btn{
    position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:12px; z-index:70;
    background:var(--glass); border:1px solid var(--glass-brd); color:var(--ink);
    width:48px; height:48px; border-radius:50%; font-size:19px; cursor:pointer;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .star-badge{
    position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); right:12px; z-index:70;
    background:var(--glass); border:1px solid var(--glass-brd); color:var(--gold);
    min-width:48px; height:48px; border-radius:24px; font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:4px; padding:0 14px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .star-badge.pop{animation:starpop .5s cubic-bezier(.3,1.6,.5,1);}
  @keyframes starpop{0%{transform:scale(1);}35%{transform:scale(1.35);}100%{transform:scale(1);}}

  .mascot-row{ display:flex; align-items:flex-end; gap:10px; margin:0 0 18px;}
  .owl-wrap{width:84px; flex:none;}
  .owl-svg{width:100%; height:auto; transform-origin:50% 100%; filter:drop-shadow(0 0 16px rgba(255,211,110,.45));}
  .owl-svg.idle{animation:owlBob 3.2s ease-in-out infinite;}
  @keyframes owlBob{50%{transform:translateY(-5px);}}
  .owl-svg.happy{animation:owlCheer .8s ease;}
  @keyframes owlCheer{30%{transform:translateY(-22px) rotate(-6deg);}60%{transform:translateY(-6px) rotate(5deg);}100%{transform:none;}}
  .owl-svg.encourage{animation:owlNod 1s ease;}
  @keyframes owlNod{25%{transform:rotate(-5deg);}55%{transform:rotate(4deg);}80%{transform:rotate(-2deg);}100%{transform:none;}}
  .owl-svg.thinking{animation:owlTilt 2.4s ease-in-out infinite;}
  @keyframes owlTilt{50%{transform:rotate(-6deg) translateY(-2px);}}
  .owl-svg.talking{animation:owlTalk .5s ease-in-out infinite;}
  @keyframes owlTalk{50%{transform:translateY(-3px) scale(1.015);}}
  .owl-lid{transform-origin:center; transform-box:fill-box; animation:owlBlink 5s infinite;}
  @keyframes owlBlink{0%,94%,100%{transform:scaleY(0);}97%{transform:scaleY(1);}}

  .bubble{
    background:var(--glass); border:1px solid var(--glass-brd); border-radius:20px 20px 20px 6px; padding:12px 16px;
    box-shadow:var(--shadow); flex:1; font-size:16px; font-weight:500; color:var(--ink);
    position:relative; min-height:20px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .home-title{ text-align:center; font-size:30px; font-weight:400; font-family:'Secular One','Rubik',sans-serif; color:var(--ink); margin:8px 0 4px;}
  .home-sub{ text-align:center; color:var(--dim); font-size:15px; margin-bottom:22px;}

  .screen-pop{animation:scenePop .5s cubic-bezier(.2,.9,.3,1) both;}
  @keyframes scenePop{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:none;}}

  .domain-card{
    display:flex; align-items:center; gap:16px;
    border-radius:26px; padding:18px 20px; margin-bottom:16px;
    cursor:pointer; border:1px solid var(--glass-brd); width:100%; text-align:right;
    box-shadow:var(--shadow); color:var(--ink); font-family:'Rubik';
    transition:transform .12s; background:var(--glass); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .domain-card:active{transform:translateY(3px);}
  .domain-card.reading{box-shadow:0 0 24px rgba(123,224,181,.18), var(--shadow);}
  .domain-card.writing{box-shadow:0 0 24px rgba(122,75,214,.22), var(--shadow);}
  .domain-card.math{box-shadow:0 0 24px rgba(255,211,110,.22), var(--shadow);}
  .domain-card.reading .domain-emoji{filter:drop-shadow(0 0 10px rgba(123,224,181,.7));}
  .domain-card.writing .domain-emoji{filter:drop-shadow(0 0 10px rgba(122,75,214,.7));}
  .domain-card.math .domain-emoji{filter:drop-shadow(0 0 10px rgba(255,211,110,.7));}
  .domain-emoji{font-size:40px;}
  .domain-info{flex:1;}
  .domain-info h2{font-size:21px; color:var(--ink);}
  .domain-info p{margin:4px 0 0; font-size:13px; opacity:0.85; display:flex; justify-content:space-between; color:var(--dim);}
  .progress-track{
    background:rgba(255,255,255,0.12); border-radius:20px; height:10px; margin-top:8px; overflow:hidden;
  }
  .progress-fill{background:linear-gradient(90deg,var(--gold),var(--mint)); height:100%; border-radius:20px; transition:width .5s ease;}

  .stage-list{ display:flex; flex-direction:column; gap:10px; margin-top:8px; animation:scenePop .45s cubic-bezier(.2,.9,.3,1) both;}
  .stage-item{
    display:flex; align-items:center; gap:14px;
    background:var(--glass); border:1px solid var(--glass-brd); border-radius:18px; padding:14px 16px;
    box-shadow:var(--shadow); cursor:pointer; width:100%; text-align:right; color:var(--ink);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .stage-item.locked{opacity:0.45; cursor:not-allowed;}
  .stage-item.current{outline:2px solid var(--gold);}
  .stage-num{
    width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; flex-shrink:0; color:var(--ink);
  }
  .stage-item.done .stage-num{background:var(--mint); color:#0b2a38;}
  .stage-title{flex:1; font-weight:600; font-size:16px;}
  .stage-check{font-size:20px;}

  .top-progress{
    display:flex; align-items:center; gap:10px; margin:6px 0 16px; font-size:14px; color:var(--dim); font-weight:500;
  }
  .top-progress .bar{flex:1; height:8px; background:rgba(255,255,255,.12); border-radius:8px; overflow:hidden;}
  .top-progress .bar-fill{height:100%; border-radius:8px; transition:width .5s ease;}

  .teach-card{
    background:var(--glass); border:1px solid var(--glass-brd); border-radius:28px; padding:28px 20px; text-align:center;
    box-shadow:var(--shadow); margin-top:10px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    animation:scenePop .45s cubic-bezier(.2,.9,.3,1) both;
  }
  .big-letter{font-size:110px; font-weight:400; font-family:'Secular One','Rubik',sans-serif; line-height:1; color:var(--gold);
    filter:drop-shadow(0 0 20px rgba(255,211,110,.5));}
  .letter-name{font-size:18px; color:var(--dim); margin-top:6px;}
  .example-row{
    display:flex; align-items:center; justify-content:center; gap:10px; margin-top:18px;
    background:rgba(255,255,255,.06); border-radius:18px; padding:14px;
  }
  .example-emoji{font-size:40px;}
  .example-word{font-size:26px; font-weight:700; font-family:'Secular One','Rubik',sans-serif; color:var(--ink);}
  .final-note{margin-top:14px; font-size:15px; background:rgba(122,75,214,.22); border:1px solid rgba(122,75,214,.4); border-radius:14px; padding:10px 14px; color:var(--ink); font-weight:600;}

  .btn{
    border:none; border-radius:18px; padding:16px 20px; font-size:18px; font-weight:700;
    font-family:'Rubik'; cursor:pointer; box-shadow:var(--shadow); color:#2a1d4d; width:100%;
    transition:transform .1s; min-height:48px;
  }
  .btn:active{transform:translateY(3px);}
  .btn.primary{background:linear-gradient(135deg,var(--mint),#54c79a); color:#0b2a38;}
  .btn.blue{background:linear-gradient(135deg,var(--mint),var(--blue-dark)); color:#0b2a38;}
  .btn.amber{background:linear-gradient(135deg,var(--gold),#e0a93f); color:#2a1d4d;}
  .btn.ghost{background:var(--glass); color:var(--ink); box-shadow:var(--shadow); border:1px solid var(--glass-brd);}
  .btn.small{padding:10px 14px; font-size:15px; width:auto; min-height:44px;}
  .btn-row{display:flex; gap:10px; margin-top:16px;}
  .btn-row .btn{flex:1;}

  .options-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px;}
  .option-btn{
    background:radial-gradient(circle at 35% 30%,rgba(255,211,110,.16),rgba(122,75,214,.16));
    border:2px solid rgba(255,211,110,.45); border-radius:50% 50% 50% 50%/58% 58% 42% 42%;
    padding:20px 10px; min-height:88px;
    font-size:32px; font-family:'Secular One','Rubik',sans-serif; cursor:pointer; box-shadow:var(--shadow); color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  }
  .option-btn .lbl{font-size:15px; font-weight:600; color:var(--dim); font-family:'Rubik';}
  .option-btn:active{transform:scale(.94);}
  .option-btn.correct{border-color:var(--mint); background:radial-gradient(circle at 35% 30%,#d9ffe9,rgba(123,224,181,.35)); color:#0b2a38; box-shadow:0 0 30px 6px rgba(123,224,181,.5);}
  .option-btn.wrong{border-color:var(--coral); opacity:0.55;}
  .option-btn:disabled{cursor:not-allowed;}

  .feedback-banner{
    margin-top:16px; padding:14px 16px; border-radius:16px; font-weight:700; text-align:center; font-size:17px;
    display:none; border:1px solid var(--glass-brd);
  }
  .feedback-banner.show{display:block;}
  .feedback-banner.good{background:rgba(123,224,181,.18); color:var(--mint);}
  .feedback-banner.bad{background:rgba(255,143,171,.14); color:var(--coral);}

  .hint-btn{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:linear-gradient(135deg,var(--gold),#e0a93f); border:none; border-radius:30px; padding:14px 26px;
    font-size:16px; font-weight:700; color:#2a1d4d; box-shadow:0 6px 18px rgba(0,0,0,.35); cursor:pointer;
    display:flex; align-items:center; gap:8px; z-index:50; max-width:480px; width:calc(100% - 32px);
    justify-content:center; min-height:48px;
  }
  .mic-circle{
    width:130px; height:130px; border-radius:50%; margin:20px auto; cursor:pointer;
    background:radial-gradient(circle at 35% 30%,rgba(123,224,181,.5),var(--plum)); display:flex; align-items:center; justify-content:center;
    font-size:56px; box-shadow:0 0 30px rgba(122,75,214,.5); color:var(--ink); transition:transform .15s;
  }
  .mic-circle.listening{animation:pulse 1s infinite; background:radial-gradient(circle at 35% 30%,#ffd9e3,var(--coral));}
  @keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.08);}100%{transform:scale(1);}}
  .word-display{font-size:48px; font-weight:400; font-family:'Secular One','Rubik',sans-serif; text-align:center; margin:10px 0; color:var(--gold);}
  .heard-text{ text-align:center; font-size:16px; color:var(--dim); min-height:22px;}

  canvas.trace-canvas{
    background:rgba(255,248,231,.9); border-radius:22px; touch-action:none; display:block; margin:14px auto; box-shadow:var(--shadow);
  }

  .dots-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; justify-items:center; margin:16px 0;}
  .dots-grid span{font-size:34px;}

  .celebrate{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 85%); z-index:100; text-align:center; padding:20px;
    animation:scenePop .5s cubic-bezier(.2,.9,.3,1) both;}
  .celebrate .emoji{font-size:90px; margin-bottom:10px; filter:drop-shadow(0 0 22px rgba(255,211,110,.6));}
  .celebrate h2{font-size:26px; margin-bottom:8px; color:var(--ink);}
  .celebrate p{color:var(--dim); margin-bottom:24px;}

  /* Spotlight: marks the button the child should press right now (in sync with the narration) */
  .spot{ position:relative; z-index:3; box-shadow:0 0 0 3px var(--gold), 0 0 28px 8px rgba(255,211,110,.7) !important;
    animation:spotPulse 1.1s ease-in-out infinite !important; }
  @keyframes spotPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}

  ::selection{background:var(--gold); color:#2a1d4d;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
    .spot{animation:none !important;}
  }
</style>
</head>
<body>
<div class="moon" aria-hidden="true"></div>
<div class="hill h1" aria-hidden="true"></div>
<div class="hill h2" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<canvas id="confettiFx" aria-hidden="true"></canvas>
<button class="mute-btn" id="muteBtn" onclick="toggleMute()" aria-label="השתקת צלילים">🔊</button>
<div class="star-badge" id="starBadge">⭐ <span id="starCount">0</span></div>
<div id="app"></div>

<script>
/* ============ DATA ============ */
const LETTERS = [
  {ch:'א', name:'אָלֶף', word:'אַרְיֵה', emoji:'🦁'},
  {ch:'ב', name:'בֵּית', word:'בַּיִת', emoji:'🏠'},
  {ch:'ג', name:'גִּימֶל', word:'גָּמָל', emoji:'🐫'},
  {ch:'ד', name:'דָּלֶת', word:'דָּג', emoji:'🐟'},
  {ch:'ה', name:'הֵא', word:'הַר', emoji:'⛰️'},
  {ch:'ו', name:'וָו', word:'וֶרֶד', emoji:'🌹'},
  {ch:'ז', name:'זַיִן', word:'זֶבְּרָה', emoji:'🦓'},
  {ch:'ח', name:'חֵית', word:'חָתוּל', emoji:'🐱'},
  {ch:'ט', name:'טֵית', word:'טֶלֶפוֹן', emoji:'📞'},
  {ch:'י', name:'יוֹד', word:'יֶלֶד', emoji:'👦'},
  {ch:'כ', name:'כָּף', word:'כֶּלֶב', emoji:'🐶', final:'ך', finalNote:'כשהאות כ״ף נמצאת בסוף המילה, היא נראית כך: ך'},
  {ch:'ל', name:'לָמֶד', word:'לֵב', emoji:'❤️'},
  {ch:'מ', name:'מֵם', word:'מַיִם', emoji:'💧', final:'ם', finalNote:'כשהאות מ״ם נמצאת בסוף המילה, היא נראית כך: ם'},
  {ch:'נ', name:'נוּן', word:'נָחָשׁ', emoji:'🐍', final:'ן', finalNote:'כשהאות נו״ן נמצאת בסוף המילה, היא נראית כך: ן'},
  {ch:'ס', name:'סָמֶך', word:'סוּס', emoji:'🐴'},
  {ch:'ע', name:'עַיִן', word:'עֵץ', emoji:'🌳'},
  {ch:'פ', name:'פֵּא', word:'פִּיל', emoji:'🐘', final:'ף', finalNote:'כשהאות פ״א נמצאת בסוף המילה, היא נראית כך: ף'},
  {ch:'צ', name:'צַדִי', word:'צִפּוֹר', emoji:'🐦', final:'ץ', finalNote:'כשהאות צד״י נמצאת בסוף המילה, היא נראית כך: ץ'},
  {ch:'ק', name:'קוֹף', word:'קוֹף', emoji:'🐵'},
  {ch:'ר', name:'רֵישׁ', word:'רַכֶּבֶת', emoji:'🚂'},
  {ch:'ש', name:'שִׁין', word:'שֶׁמֶשׁ', emoji:'☀️'},
  {ch:'ת', name:'תָיו', word:'תַּפּוּחַ', emoji:'🍎'},
];

const FINALS = [
  {base:'כ', final:'ך', baseName:'כָּף', word:'מֶלֶךְ', emoji:'👑'},
  {base:'מ', final:'ם', baseName:'מֵם', word:'יָם', emoji:'🌊'},
  {base:'נ', final:'ן', baseName:'נוּן', word:'בֵּן', emoji:'👦'},
  {base:'פ', final:'ף', baseName:'פֵּא', word:'עָנָף', emoji:'🌿'},
  {base:'צ', final:'ץ', baseName:'צַדִי', word:'עֵץ', emoji:'🌳'},
];

const NIQUD = [
  {sign:'ַ', name:'פַּתָח', sound:'a', ex:'בַּ', explain:'הסימן פַּתָח הוא קו אלכסוני קטן מתחת לאות, ונשמע כמו הצליל א, כמו במילה אַבָּא'},
  {sign:'ָ', name:'קָמָץ', sound:'a', ex:'בָּ', explain:'הסימן קָמָץ נראה כמו האות ת הפוכה מתחת לאות, ולרוב נשמע גם הוא כמו הצליל א, כמו במילה קָם'},
  {sign:'ֶ', name:'סֶגּוֹל', sound:'e', ex:'בֶּ', explain:'הסימן סֶגּוֹל הוא שלוש נקודות בצורת משולש מתחת לאות, ונשמע כמו הצליל אֶ, כמו במילה יֶלֶד'},
  {sign:'ֵ', name:'צֵירֵה', sound:'e', ex:'בֵּ', explain:'הסימן צֵירֵה הוא שתי נקודות זו לצד זו מתחת לאות, ונשמע גם הוא כמו הצליל אֶ, כמו במילה תֵּה'},
  {sign:'ִ', name:'חִירִיק', sound:'i', ex:'בִּ', explain:'הסימן חִירִיק הוא נקודה אחת מתחת לאות, ונשמע כמו הצליל אִי, כמו בתחילת המילה אִמָּא'},

let heVoice = null;

const MALE_RE = /asaf|avri|\bmale\b|david|ilan|גבר/i;
const FEMALE_RE = /carmit|hila|noa|yael|tamar|female|zira|אישה|נקבה/i;
function pickVoice(){
  try{
    const voices = speechSynthesis.getVoices();
    heVoiceList = voices.filter(v=>/^(he|iw)/i.test(v.lang) || /hebrew|עברית/i.test(v.name));
    let saved = null;
    try{ saved = localStorage.getItem('voiceName'); }catch(e){}
    heVoice = (saved && heVoiceList.find(v=>v.name===saved))
      || heVoiceList.find(v=>FEMALE_RE.test(v.name) && !MALE_RE.test(v.name))
      || heVoiceList.find(v=>!MALE_RE.test(v.name))
      || heVoiceList[0]
      || null;
  }catch(e){}
}
function voiceIsFemale(){ return !!(heVoice && FEMALE_RE.test(heVoice.name) && !MALE_RE.test(heVoice.name)); }

function applyVoice(u){
  u.lang = heVoice ? heVoice.lang : 'he-IL';

  u.rate = 0.92;

/* A narration that belongs to a screen the child already left never "finishes":
   its follow-up lines (strategy, highlights) are dropped instead of being spoken over the next screen. */
function speak(text, opts){
  const keep = !!(opts && opts.keep);
  return new Promise(resolve=>{
    if(!('speechSynthesis' in window)){resolve(); return;}
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      applyVoice(u);
      const tok = window.__screenTok, my = ++window.__speakId;
      window.__speaking = true;
      setOwlState('talking', true);
      let finished = false;
      const done = ()=>{
        if(finished) return; finished = true;
        if(my===window.__speakId){ window.__speaking = false; setOwlState('talking', false); }
        if(keep || tok===window.__screenTok) resolve();
      };
      u.onend = done; u.onerror = done;
      setTimeout(done, Math.max(3500, String(text).length*170)); /* safety: some phones never fire onend */
      speechSynthesis.speak(u);
    }catch(e){ window.__speaking = false; setOwlState('talking', false); resolve(); }
  });
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function clearSpots(){ document.querySelectorAll('.spot').forEach(e=>e.classList.remove('spot')); }
/* Say several lines in order; each line can highlight the button(s) it is talking about */
async function speakSeq(parts, tok){
  for(const p of parts){
    if(tok!==window.__screenTok) return false;
    const els = p.spot ? [].concat(p.spot).filter(Boolean) : [];
    els.forEach(e=>e.classList.add('spot'));
    if(p.scroll && els[0]){ try{ els[0].scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){} }
    const t0 = Date.now();
    await speak(p.text);
    const rest = (p.min||900) - (Date.now()-t0);
    if(rest>0) await sleep(rest);
    if(tok!==window.__screenTok) return false;
    els.forEach(e=>e.classList.remove('spot'));
  }
  return tok===window.__screenTok;
}

/* Gentle Web Audio tones (separate from the speech voice) */
let audioCtx = null;
function ensureAudioCtx(){
  if(audioCtx) return audioCtx;
  try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  return audioCtx;
}
function unlockAudioCtx(){
  const ctx = ensureAudioCtx();
  if(ctx && ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
}
function playTone(kind){
  try{
  if(fxMuted) return;
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
  const quiet = window.__speaking ? 0.4 : 1;
  const baseVol = 0.13 * quiet;
  const now = ctx.currentTime;
  const notes = kind==='ok' ? [523.25,659.25,783.99]
    : kind==='oops' ? [392,349.23]
    : kind==='stage' ? [523.25,659.25,783.99,1046.5]
    : [392,523.25,659.25,783.99,1046.5,1318.5];
  notes.forEach((freq,i)=>{
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    const t = now + i*0.09;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(baseVol, t+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+0.24);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t); osc.stop(t+0.26);
  });
  }catch(e){}
}
function toggleMute(){

  try{ localStorage.setItem('fxMuted', fxMuted?'1':'0'); }catch(e){}

  if(btn) btn.innerText = fxMuted ? '🔇' : '🔊';
}

/* Idempotent trigger: correctPhrase()/wrongPhrase() are sometimes called twice for one
   answer (once for the on-screen text, once for speech) - this guard fires the
   reaction only once per real event, with no changes needed at any call site. */
let _fxLock = false;
function fireFx(kind){
  if(_fxLock) return;
  _fxLock = true;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ _fxLock = false; }));
  try{
    if(kind==='ok'){ owlReact('happy', 750); playTone('ok'); bumpStar(); }
    else { owlReact('encourage', 950); playTone('oops'); }
  }catch(e){}
}

/* Ambient firefly particles - canvas based, capped, slows while the voice is speaking */
(function initFireflies(){
  const canvas = document.getElementById('fx');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  if(prefersReducedMotion) return;
  const COUNT = 26;
  const flies = Array.from({length:COUNT}, ()=>({
    x: Math.random()*innerWidth, y: innerHeight*0.3 + Math.random()*innerHeight*0.65,
    r: 1.1+Math.random()*1.5, phase: Math.random()*Math.PI*2,
    dx:(Math.random()-0.5)*0.3, dy:(Math.random()-0.5)*0.2
  }));
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const slow = window.__speaking ? 0.35 : 1;
    flies.forEach(f=>{
      f.phase += 0.02*slow;
      f.x += f.dx*slow; f.y += f.dy*slow;
      if(f.x<0) f.x=canvas.width; if(f.x>canvas.width) f.x=0;
      if(f.y<canvas.height*0.25) f.y=canvas.height*0.25; if(f.y>canvas.height) f.y=canvas.height;
      const a = (Math.sin(f.phase)*0.4+0.6) * (window.__speaking?0.5:1);
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,211,110,${a.toFixed(2)})`;
      ctx.arc(f.x,f.y,f.r*(1+a*0.4),0,Math.PI*2);
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* Confetti burst - canvas based, capped at ~35 pieces even for the big celebration */
function burstConfetti(big){
 try{
  const canvas = document.getElementById('confettiFx');
  if(!canvas || prefersReducedMotion) return;
  const ctx = canvas.getContext('2d');
  canvas.width = innerWidth; canvas.height = innerHeight;
  const count = big ? 34 : 22;
  const colors = ['#ffd36e','#7be0b5','#7a4bd6','#ff8fab','#fff8e7'];
  const pieces = Array.from({length:count}, ()=>({
    x: innerWidth/2 + (Math.random()-0.5)*innerWidth*0.7,
    y: innerHeight*0.3 + (Math.random()-0.5)*40,
    vx:(Math.random()-0.5)*4, vy:-(2+Math.random()*(big?4:3)),
    size:4+Math.random()*4, color:colors[Math.floor(Math.random()*colors.length)],
    rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.2, life:0
  }));
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    pieces.forEach(p=>{
      p.life++; p.vy += 0.08; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if(p.life < 130) alive = true;
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - p.life/130);
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      ctx.restore();
    });
    if(alive) requestAnimationFrame(tick); else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  tick();
 }catch(e){}
}

      return {stageIndex:0, completed:{}};

  if(!question){
    const target = NIQUD[Math.floor(Math.random()*NIQUD.length)];

    const opts = shuffle([target, ...shuffle(others).slice(0,3)]).map(o=>({sign:o.sign,name:o.name,ex:o.ex}));
    const correctIdx = opts.findIndex(o=>o.sign===target.sign);
    question = {opts, correctIdx, tried:[], attempts:0, target};
  }
  const {opts, correctIdx, tried, attempts, target} = question;
  app.innerHTML = `${topbar('תרגול ניקוד')}
    ${progressHeader(domain, idx)}
    <div class="teach-card">

    </div>
    <div class="options-grid" id="opts">
      ${opts.map((o,i)=>{
        const disabled = tried.includes(i);
        return `<button class="option-btn ${disabled?'wrong':''}" data-i="${i}" ${disabled?'disabled':''} onclick="answerNiqud(${i},${correctIdx},'${domain}',${idx},${round},${correctCount},${enc(question)})">${o.ex}<span class="lbl">${o.name}</span></button>`;
      }).join('')}
    </div>
    <div class="feedback-banner" id="fb"></div>`;
  showHint(g('תקשיבי איך נשמע הסימן: ','תקשיב איך נשמע הסימן: ')+target.name);
  if(attempts===0) promptOptions('איפה הניקוד של ' + target.name + '?');
}
function answerNiqud(i, correctIdx, domain, idx, round, correctCount, question){
  const btns = document.querySelectorAll('#opts .option-btn');
  const fb = document.getElementById('fb');
  removeHint();
  if(i===correctIdx){
    btns.forEach(b=>b.disabled=true);
    btns[i].classList.add('correct');
    fb.className='feedback-banner show good'; fb.innerText=correctPhrase();
    speak(correctPhrase());
    setTimeout(()=>practiceNiqudMCQ(domain, idx, round+1, correctCount+1), 1200);
  }else{
    question.tried.push(i); question.attempts++;
    btns[i].classList.add('wrong'); btns[i].disabled=true;
    if(question.attempts>=3){
      btns.forEach(b=>b.disabled=true);
      const cb = document.querySelector(`#opts .option-btn[data-i="${correctIdx}"]`);
      if(cb) cb.classList.add('correct');
      const explain = `זה היה הסימן ${question.target.name}.`;
      fb.className='feedback-banner show bad'; fb.innerText=explain;
      speak(explain);
      setTimeout(()=>practiceNiqudMCQ(domain, idx, round+1, correctCount), 2200);
    }else{
      fb.className='feedback-banner show bad'; fb.innerText=wrongPhrase();
      speak(wrongPhrase());
      setTimeout(()=>practiceNiqudMCQ(domain, idx, round, correctCount, question), 1100);
    }
  }
}

async function recordWord(target, domain, idx, attempts){
  attempts = attempts||0;
  const mic = document.getElementById('mic');
  const heard = document.getElementById('heard');
  const fb = document.getElementById('fb');
  if(!mic || window.__recBusy) return;           /* ignore double taps while already listening */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    fb.className='feedback-banner show bad';
    fb.innerText='הדפדפן הזה לא תומך בזיהוי קול. אפשר ללחוץ על דילוג כדי להמשיך';
    speak('הדפדפן הזה לא תומך בהקלטה. אפשר ללחוץ על דילוג כדי להמשיך');
    const skip = document.querySelector('.btn-row .btn.ghost'); if(skip) skip.classList.add('spot');
    return;
  }
  /* Stop the voice first - the recognizer must not hear the narrator, and phones can't do both at once */
  try{ speechSynthesis.cancel(); }catch(e){}
  window.__speaking = false; setOwlState('talking', false);
  let rec;
  try{ rec = new SR(); }catch(e){
    fb.className='feedback-banner show bad'; fb.innerText='לא הצלחתי להפעיל את זיהוי הקול';
    return;
  }
  window.__rec = rec;                            /* keep a reference: some browsers drop events if the object is collected */
  window.__recBusy = true;
  let got = false, failed = false;
  const mine = ()=> window.__rec===rec;
  const finish = ()=>{
    clearTimeout(timer);
    if(mine()){ window.__recBusy = false; }
    mic.classList.remove('listening'); setOwlState('thinking', false);
  };
  mic.classList.add('listening');
  mic.classList.remove('spot');
  setOwlState('thinking', true);
  heard.innerText = 'מקשיבה...';
  fb.className='feedback-banner';
  const norm = x=>String(x).replace(/[\u0591-\u05C7]/g,'').replace(/[^\u05D0-\u05EA]/g,'');
  const want = norm(target);
  rec.lang='he-IL'; rec.interimResults=false; rec.maxAlternatives=5; rec.continuous=false;
  rec.onresult = (e)=>{
    if(!mine()) return;
    got = true; finish();
    const alts = [];
    for(let i=0;i<e.results[0].length;i++) alts.push(e.results[0][i].transcript.trim());
    heard.innerText = 'שמעתי: '+alts[0];
    const ok = alts.some(a=>{ const n=norm(a); return n.length>0 && (n.includes(want) || (n.length>=2 && want.includes(n))); });
    if(ok){
      const cp = correctPhrase();
      fb.className='feedback-banner show good'; fb.innerText=cp;
      speak(cp);
      setTimeout(()=>finishStagePractice(domain, idx), 1600);
    }else{
      const newAttempts = attempts+1;
      if(newAttempts>=3){
        fb.className='feedback-banner show bad'; fb.innerText='כל הכבוד על ההשתדלות! עוברים לשלב הבא';
        speak('כל הכבוד על ההשתדלות!');
        setTimeout(()=>finishStagePractice(domain, idx), 2000);
      }else{
        fb.className='feedback-banner show bad'; fb.innerText=wrongPhrase();
        speak(wrongPhrase());
        setTimeout(()=>practiceReadAloud(domain, idx, {word:target}, newAttempts), 1800);
      }
    }
  };
  rec.onerror = (e)=>{
    if(!mine() || e.error==='aborted') return;
    failed = true; finish();
    let msg = 'הייתה בעיה בזיהוי הקול, אפשר ללחוץ שוב על המיקרופון';
    if(e.error==='not-allowed' || e.error==='service-not-allowed') msg='צריך לאשר גישה למיקרופון בדפדפן, ואז ללחוץ שוב על המיקרופון';
    else if(e.error==='audio-capture') msg='לא נמצא מיקרופון במכשיר';
    else if(e.error==='no-speech') msg=g('לא שמעתי כלום, נסי לדבר קצת יותר חזק וקרוב למסך','לא שמעתי כלום, נסה לדבר קצת יותר חזק וקרוב למסך');
    else if(e.error==='network') msg='יש כרגע בעיית רשת בזיהוי הקול, אפשר לנסות שוב או ללחוץ על דילוג';
    else if(e.error==='language-not-supported') msg='זיהוי קול בעברית לא נתמך בדפדפן הזה, אפשר ללחוץ על דילוג';
    heard.innerText = '('+e.error+')';
    fb.className='feedback-banner show bad'; fb.innerText=msg;
    speak(msg);
    mic.classList.add('spot');
  };
  rec.onend = ()=>{
    if(!mine()) return;
    const wasBusy = window.__recBusy;
    finish();
    if(!got && !failed && wasBusy){                 /* ended without hearing anything */
      const msg = g('לא שמעתי, בואי ננסה שוב','לא שמעתי, בוא ננסה שוב');
      heard.innerText=''; fb.className='feedback-banner show bad'; fb.innerText=msg; speak(msg);
      mic.classList.add('spot');
    }
  };
  const timer = setTimeout(()=>{ try{ rec.stop(); }catch(e){} }, 9000);   /* some phones never stop on their own */
  try{ rec.start(); }catch(err){
    finish();
    fb.className='feedback-banner show bad'; fb.innerText=g('לא הצלחתי להתחיל להקליט, נסי ללחוץ שוב','לא הצלחתי להתחיל להקליט, נסה ללחוץ שוב');
  }
}

  } else if(stage.kind==='numbers100'){
    bodyHtml = `<div style="font-size:17px;font-weight:700">נלמד להכיר מספרים עד 100</div>
      <div style="margin-top:12px;font-size:26px">🔟🔟🔟 🍎🍎🍎🍎</div>`;
    narration = 'נלמד להכיר מספרים עד 100';
    strat = STRATEGIES.numbers100();
  }
  app.innerHTML = `${topbar('לומדים חשבון')}
    ${progressHeader(domain, idx)}
    <div class="teach-card">${bodyHtml}</div>
    ${strategyBox(strat)}
    <button class="btn blue" style="margin-top:18px" onclick="speak('${narration}')">🔊 השמיעי שוב</button>
    <button class="btn primary" style="margin-top:10px" onclick="startMathPractice('${domain}',${idx})">התחלת תרגול ➡️</button>`;
  await speak(narration);
  await speak(strat); spotPrimary();
}
function startMathPractice(domain, idx){
  const stage = DOMAINS[domain].stages[idx];
  practiceMathRound(domain, idx, stage, 0, 0);
}
function generateMathQuestion(stage){
  let display, correctAns, opts, hint, prompt, explain;
  if(stage.kind==='count'){
    const n = Math.floor(Math.random()*(stage.range[1]-stage.range[0]+1))+stage.range[0];
    const em = pick(['🍎','⭐','🐝','🎈','🍓']);
    display = `<div class="dots-grid">${Array.from({length:n}).map(()=>`<span>${em}</span>`).join('')}</div><div style="margin-top:10px">כמה יש כאן?</div>`;
    correctAns = n; opts = shuffle(uniqueNums(n,1,stage.range[1]+2,4));
    hint = 'נסי לספור עם האצבע, אחת אחת';
    prompt = 'כמה יש כאן?';
    explain = `יש כאן ${n}.`;
  } else if(stage.kind==='subitize'){
    const n = Math.floor(Math.random()*4)+2;
    display = `<div class="dots-grid">${Array.from({length:n}).map(()=>`<span>🔵</span>`).join('')}</div><div style="margin-top:10px">כמה עיגולים יש במבט מהיר?</div>`;
    correctAns = n; opts = shuffle(uniqueNums(n,1,7,4));
    hint = 'הסתכלי על כל הקבוצה בבת אחת';
    prompt = 'כמה יש כאן?';
    explain = `יש כאן ${n}.`;
  } else if(stage.kind==='compare'){
    let a = Math.floor(Math.random()*10)+1, b = Math.floor(Math.random()*10)+1;
    if(Math.random()<0.25) b=a;
    display = `<div style="font-size:38px;font-weight:900">${a} ? ${b}</div><div style="margin-top:10px">איזה סימן מתאים?</div>`;
    const symbol = a>b?'>':(a<b?'<':'=');
    opts = shuffle(['>','<','=']);
    correctAns = symbol;
    hint = 'המספר הגדול הוא זה שסופרים אליו רחוק יותר';
    prompt = 'מה הסימן הנכון?';
    const symbolWord = symbol==='>' ? 'גדול מ' : symbol==='<' ? 'קטן מ' : 'שווה ל';
    explain = `הסימן הנכון הוא ${symbolWord}`;
  } else if(stage.kind==='add'){
    const max = stage.range[1];
    let a = Math.floor(Math.random()*(max-1))+1, b = Math.floor(Math.random()*(max-a))+1;
    if(a+b>max){b=Math.max(1,max-a);}
    display = `<div style="font-size:38px;font-weight:900">${a} + ${b} = ?</div>`;
    correctAns = a+b; opts = shuffle(uniqueNums(a+b,1,max+2,4));
    hint = 'התחילי מהמספר הגדול והוסיפי את השני';
    prompt = 'כמה זה?';
    explain = `${a} ועוד ${b} שווה ל-${a+b}`;
  } else if(stage.kind==='subtract'){
    const max = stage.range[1];
    let a = Math.floor(Math.random()*max)+1;
    let b = Math.floor(Math.random()*(a+1));
    if(b>a) b=a;
    display = `<div style="font-size:38px;font-weight:900">${a} - ${b} = ?</div>`;
    correctAns = a-b; opts = shuffle(uniqueNums(a-b,0,max,4));
    hint = 'התחילי מהמספר הגדול והחסירי';
    prompt = 'כמה זה?';
    explain = `${a} פחות ${b} שווה ל-${a-b}`;
  } else if(stage.kind==='numbers100'){
    const n = Math.floor(Math.random()*91)+10;
    const tens = Math.floor(n/10), units = n%10;
    display = `<div style="font-size:26px">${'🔟'.repeat(tens)} ${'🍎'.repeat(units)}</div><div style="margin-top:10px">איזה מספר זה?</div>`;
    correctAns = n; opts = shuffle(uniqueNums(n,10,100,4));
    hint = g(`תחשבי: ${tens} עשרות ועוד ${units} יחידות`, `תחשוב: ${tens} עשרות ועוד ${units} יחידות`);
    prompt = 'איזה מספר זה?';
    explain = `זה המספר ${n}`;
  }
  const correctIdx = opts.indexOf(correctAns);
  return {display, opts, correctIdx, tried:[], attempts:0, hint, prompt, explain};
}
function practiceMathRound(domain, idx, stage, round, correctCount, question){
  const total = 4;
  if(round>=total) return finishStagePractice(domain, idx);
  if(!question) question = generateMathQuestion(stage);
  const {display, opts, correctIdx, tried, attempts} = question;
  app.innerHTML = `${topbar('תרגול חשבון')}
    ${progressHeader(domain, idx)}
    <div class="teach-card">${display}</div>
    <div class="options-grid" id="opts">
      ${opts.map((o,i)=>{
        const disabled = tried.includes(i);
        return `<button class="option-btn ${disabled?'wrong':''}" data-i="${i}" ${disabled?'disabled':''} onclick="answerMath(${i},${correctIdx},'${domain}',${idx},${enc(stage)},${round},${correctCount},${enc(question)})">${o}</button>`;
      }).join('')}
    </div>
    <div class="feedback-banner" id="fb"></div>`;
  showHint(question.hint);
  if(attempts===0) promptOptions(question.prompt||'כמה זה?');
}
function answerMath(i, correctIdx, domain, idx, stage, round, correctCount, question){
  const btns = document.querySelectorAll('#opts .option-btn');
  const fb = document.getElementById('fb');
  removeHint();
  if(i===correctIdx){
    btns.forEach(b=>b.disabled=true);
    btns[i].classList.add('correct');
    fb.className='feedback-banner show good'; fb.innerText=correctPhrase();
    speak(correctPhrase());
    setTimeout(()=>practiceMathRound(domain, idx, stage, round+1, correctCount+1), 1200);
  }else{
    question.tried.push(i); question.attempts++;
    btns[i].classList.add('wrong'); btns[i].disabled=true;
    if(question.attempts>=3){
      btns.forEach(b=>b.disabled=true);
      const cb = document.querySelector(`#opts .option-btn[data-i="${correctIdx}"]`);
      if(cb) cb.classList.add('correct');
      fb.className='feedback-banner show bad'; fb.innerText=question.explain;
      speak(question.explain);
      setTimeout(()=>practiceMathRound(domain, idx, stage, round+1, correctCount), 2200);
    }else{
      fb.className='feedback-banner show bad'; fb.innerText=wrongPhrase();
      speak(wrongPhrase());
      setTimeout(()=>practiceMathRound(domain, idx, stage, round, correctCount, question), 1100);
    }
  }
}
function uniqueNums(correct, min, max, count){
  const set = new Set([correct]);
  let guard=0;
  while(set.size<count && guard<300){
    const n = Math.floor(Math.random()*(max-min+1))+min;
    set.add(n);
    guard++;
  }
  return Array.from(set);
}

/* ---------- SHARED ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
async function finishStagePractice(domain, idx){
  removeHint();
  await markStageComplete(domain, idx);
  const total = DOMAINS[domain].stages.length;
  const isLast = idx>=total-1;
  app.innerHTML = `<div class="celebrate">

    <div class="emoji">🎉</div>
    <h2>${g('סִיַּמְתְּ את השלב!','סִיַּמְתָּ את השלב!')}</h2>
    <p>${isLast?g('וואו! סִיַּמְתְּ את כל התחום, אַתְּ אַלּוּפָה!','וואו! סִיַּמְתָּ את כל התחום, אתה אלוף!'):g('בואי נמשיך לשלב הבא','בוא נמשיך לשלב הבא')}</p>
    <button class="btn primary" onclick="${isLast?`goHome()`:`startStage('${domain}',${idx+1})`}" style="max-width:280px">${isLast?'לחזרה הביתה 🏠':'לשלב הבא ➡️'}</button>
    <button class="btn ghost" style="max-width:280px;margin-top:10px" onclick="openDomain('${domain}')">רשימת השלבים 📋</button>
  </div>`;
  burstConfetti(isLast);
  playTone(isLast ? 'big' : 'stage');
  if(isLast) setTimeout(()=>burstConfetti(true), 450);
  speakThenSpot(isLast? g('וואו! סִיַּמְתְּ את כל התחום. אַתְּ אַלּוּפָה גְּדוֹלָה!','וואו! סִיַּמְתָּ את כל התחום. אתה אלוף גדול!') : g('כל הכבוד! סִיַּמְתְּ את השלב. בואי נמשיך לשלב הבא','כל הכבוד! סִיַּמְתָּ את השלב. בוא נמשיך לשלב הבא'));
}

function showVoiceDiag(text){
  let el = document.getElementById('voiceDiag');
  if(el){ el.innerText = text; return; }
  let banner = document.getElementById('voiceDiagFloat');
  if(!banner){
    banner = document.createElement('div');
    banner.id = 'voiceDiagFloat';
    banner.style.cssText = 'position:fixed;top:12px;left:12px;right:12px;z-index:200;background:#3A3352;color:white;padding:12px 16px;border-radius:16px;font-size:14px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,0.25);';
    document.body.appendChild(banner);
  }
  banner.innerText = text;
  clearTimeout(window.__voiceDiagTimer);
  window.__voiceDiagTimer = setTimeout(()=>{ if(banner) banner.remove(); }, 6000);
}
function testVoice(){
  if(!('speechSynthesis' in window)){
    showVoiceDiag('הדפדפן הזה לא תומך בקול בכלל');
    return;
  }
  pickVoice();
  const voices = speechSynthesis.getVoices();
  const heVoices = voices.filter(v=>/he|iw/i.test(v.lang));
  if(voices.length===0){
    showVoiceDiag('לא נמצא אף קול במכשיר. צריך להתקין מנוע הקראה (Google Text-to-Speech) בהגדרות הטלפון');
  } else if(heVoices.length===0){
    showVoiceDiag(`נמצאו ${voices.length} קולות אך אף אחד בעברית. צריך להוריד חבילת שפה עברית בהגדרות ההקראה בטלפון`);
  } else {
    showVoiceDiag(`נמצא קול עברי: ${heVoices[0].name} (${heVoices[0].lang}). מנגנת עכשיו...`);
  }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance('אחת שתיים שלוש, זו בדיקת קול');
    applyVoice(u);
    speechSynthesis.speak(u);
  }catch(e){}
}
